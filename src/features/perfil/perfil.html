<div class="page-head">
  <div>
    <h1 class="page-title">Mi perfil</h1>
    <p class="page-sub">Actualiza tus datos e intereses: las recomendaciones se recalculan al guardar.</p>
  </div>
</div>

<div class="grid grid-2">
  <form class="card profile-form" id="profileForm" novalidate>
    <div class="field"><label class="field-label" for="pfName">Nombre</label>
      <input class="input" id="pfName" type="text" maxlength="40" autocomplete="given-name"></div>
    <div class="field"><div class="field-inline"><label class="field-label" for="pfAge">Edad</label><span class="field-value" id="pfAgeValue"></span></div>
      <input type="range" id="pfAge" min="12" max="28"></div>
    <div class="field"><label class="field-label" for="pfBarrio">Barrio</label>
      <select id="pfBarrio"></select></div>
    <div class="field"><span class="field-label">Disponibilidad</span><div class="chip-group" id="pfAvailability"></div></div>
    <div class="field"><span class="field-label">Intereses</span><div class="chip-group" id="pfInterests"></div></div>
    <div class="field"><span class="field-label">Rol</span><div class="chip-group" id="pfRole"></div>
      <p class="small muted" id="pfRoleHint"></p></div>
    <button class="btn btn-primary" type="submit">Guardar cambios</button>
  </form>

  <div class="stack">
    <section class="card">
      <h3 class="card-title">Mis inscripciones</h3>
      <div class="stack" id="pfEnrollments"></div>
    </section>
    <section class="card">
      <h3 class="card-title">Sesión</h3>
      <p class="small muted session-note">Tus datos se guardan solo en este navegador. Al cerrar sesión se borran el perfil y tus inscripciones.</p>
      <button class="btn btn-danger" type="button" id="signOutBtn"></button>
    </section>
  </div>
</div>
