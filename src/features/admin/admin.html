<span class="eyebrow">Panel · Administrador</span>
<h2 class="screen-title">Aprobar proyectos y crear eventos</h2>
<p class="screen-sub">Aprueba o rechaza proyectos enviados por colectivos juveniles, y crea nuevos eventos desde aquí.</p>
<div class="admin-grid">
  <div class="card">
    <h3 class="card-title">Proyectos pendientes de aprobación</h3>
    <div id="pendingList"></div>
    <p class="approved-count">Aprobados hoy: <b id="approvedCount">0</b></p>
  </div>
  <div class="card">
    <h3 class="card-title">Próximos eventos</h3>
    <div class="events-mini" id="eventsMini"></div>
    <button class="btn btn-ghost btn-block create-event-btn" type="button" id="createEventBtn">+ Crear nuevo evento</button>
  </div>
</div>
