<div class="page">
  <header class="page-header">
    <div class="page-title-row">
      <h1 class="page-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Impacto cultural
      </h1>
      <p class="page-sub">Vista global para administración: jóvenes registrados, actividades y eventos de toda la comuna. Filtra por barrio para ver su pulso.</p>
    </div>
    <div class="page-actions">
      <select class="input filter-select" id="barrioFilter" aria-label="Filtrar por barrio"></select>
      <button class="btn btn-outline" type="button" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar reporte
      </button>
    </div>
  </header>

  <div class="kpi-grid" id="kpiGrid" aria-label="Indicadores clave"></div>

  <section class="card panel barrio-pulse" aria-labelledby="pulseTitle">
    <header class="panel-header">
      <h2 id="pulseTitle" class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        Participación por barrio <span class="pulse-indicator" aria-hidden="true"></span>
      </h2>
    </header>
    <div class="bars" id="barChart" role="img" aria-label="Gráfico de barras de participación por barrio"></div>
  </section>

  <div class="charts-grid">
    <section class="card panel" aria-labelledby="roleTitle">
      <header class="panel-header"><h2 id="roleTitle" class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Consumidores vs. Creadores</h2></header>
      <div class="donut-wrap" id="roleDonut"></div>
    </section>

    <section class="card panel" aria-labelledby="interestTitle">
      <header class="panel-header"><h2 id="interestTitle" class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Intereses más populares</h2></header>
      <div class="donut-wrap" id="interestDonut"></div>
    </section>
  </div>

  <section class="card table-card" aria-labelledby="eventsTableTitle">
    <header class="panel-header"><h2 id="eventsTableTitle" class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      Eventos publicados</h2></header>
    <div class="table-scroll">
      <table class="data">
        <thead><tr><th>Evento</th><th>Organiza</th><th>Barrio</th><th>Fecha</th><th>Inscritos</th><th>Precio</th><th>Estado</th></tr></thead>
        <tbody id="eventsTableBody"></tbody>
      </table>
    </div>
  </section>
</div>
