<div class="page">
  <header class="page-header">
    <div class="page-title-row">
      <h1 class="page-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Mis eventos
      </h1>
      <p class="page-sub">Crea eventos y sigue su rendimiento: inscripciones, ocupación e ingresos. Cada evento pasa por revisión antes de publicarse.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" type="button" id="createEventBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Crear evento
      </button>
    </div>
  </header>

  <div class="kpi-grid" id="mgKpis" aria-label="Resumen de gestión"></div>

  <div class="page-grid mg-panels">
    <section class="card panel" aria-labelledby="occTitle">
      <header class="panel-header">
        <h2 id="occTitle" class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Ocupación por evento
        </h2>
      </header>
      <div class="stack" id="mgOccupancy"></div>
    </section>

    <section class="card panel" aria-labelledby="statusTitle">
      <header class="panel-header">
        <h2 id="statusTitle" class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Estado de tus eventos
        </h2>
      </header>
      <div class="stack" id="mgStatus"></div>
    </section>
  </div>

  <section class="card table-card mg-table" aria-labelledby="detailTitle">
    <header class="panel-header">
      <h2 id="detailTitle" class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        Detalle por evento
      </h2>
    </header>
    <div class="table-scroll">
      <table class="data">
        <thead>
          <tr>
            <th>Evento</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Inscritos / Cupo</th>
            <th>Precio</th>
            <th>Ingresos est.</th>
          </tr>
        </thead>
        <tbody id="mgRows"></tbody>
      </table>
    </div>
  </section>
</div>
